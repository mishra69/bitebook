# Settings for deploy.sh (copied from the pwa-cloudflare skill). Use `npm run deploy`,
# which picks the version, builds with it (the build stamps sw.js and writes
# version.json), then runs deploy.sh with VERSION_OVERRIDE so it polls for that version.
WORKER_DIR=.
STAMP_FILES=""                                   # stamping happens in the Vite build
VERIFY_URL=https://bitebook.mishabhi.workers.dev
VERIFY_PATH=/version.json
GIT_COMMIT=0                                     # the version lives in the build, not in git
